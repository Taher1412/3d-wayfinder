<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Drive a little car around a low-poly map of France: monuments, and the paperwork every new international student has to do." />
    <meta name="theme-color" content="#e9ece9" />
    <title>3D Wayfinder</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 3 2%27%3E%3Cpath fill=%27%234a6fa5%27 d=%27M0 0h1v2H0z%27/%3E%3Cpath fill=%27%23f4f1ea%27 d=%27M1 0h1v2H1z%27/%3E%3Cpath fill=%27%23c4574f%27 d=%27M2 0h1v2H2z%27/%3E%3C/svg%3E" />
    <style>
      /* Critical loader styles, inline so the first paint doesn't wait for any JS */
      html, body { margin: 0; height: 100%; background: #e9ece9; }
      .loader { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: #e9ece9; color: #2f3440; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; transition: opacity 0.6s ease, visibility 0.6s; }
      .loader.is-done { opacity: 0; visibility: hidden; }
      .loader__card { display: grid; justify-items: center; gap: 14px; padding: 24px; text-align: center; }
      .loader__flag { display: flex; width: 54px; height: 6px; border-radius: 3px; overflow: hidden; }
      .loader__flag span { flex: 1; }
      .loader__flag span:nth-child(1) { background: #4a6fa5; }
      .loader__flag span:nth-child(2) { background: #faf8f3; }
      .loader__flag span:nth-child(3) { background: #c4574f; }
      .loader__title { margin: 0; font: 600 clamp(28px, 6vw, 44px)/1.1 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; letter-spacing: -0.01em; }
      .loader__tagline { margin: -8px 0 0; font: italic 16px/1.3 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; color: #5d6370; }
      .loader__status { margin: 0; min-height: 1.4em; font-size: 14px; color: #5d6370; }
      .loader__bar { width: min(240px, 60vw); height: 3px; border-radius: 2px; background: rgba(47, 52, 64, 0.1); overflow: hidden; }
      .loader__bar span { display: block; height: 100%; width: 100%; background: #4a6fa5; transform: scaleX(0.08); transform-origin: left; transition: transform 0.5s ease; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui"></div>
    <div class="loader" id="loader" role="status" aria-live="polite">
      <div class="loader__card">
        <div class="loader__flag" aria-hidden="true"><span></span><span></span><span></span></div>
        <h1 class="loader__title">3D Wayfinder</h1>
        <p class="loader__tagline">Bienvenue en France</p>
        <p class="loader__status">Loading…</p>
        <div class="loader__bar" aria-hidden="true"><span></span></div>
      </div>
    </div>
    <noscript><p style="position:fixed;bottom:24px;width:100%;text-align:center">This experience needs JavaScript.</p></noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
